<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fanny, ein Apfelschimmel mit rosa Mähne">
  <title>Fanny</title>
  <defs>
    <linearGradient id="glitter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e27a"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#d7c4ff"/>
      <stop offset="1" stop-color="#f8e27a"/>
    </linearGradient>
    <style>
      .line { stroke: #4b5263; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .sparkle { fill: #fff6c2; stroke: #f0b929; stroke-width: 0.8; transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
      .s2 { animation-delay: 0.6s; } .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.8s; }
      @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.5); } }
      @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
    </style>
  </defs>

  <!-- Hals -->
  <path class="line" d="M72,118 Q64,165 56,200 L148,200 Q138,165 128,118 Z" fill="#f1f3f6"/>
  <g fill="#c3cad6">
    <circle cx="80" cy="176" r="7"/><circle cx="118" cy="186" r="8"/>
    <circle cx="100" cy="164" r="5"/><circle cx="128" cy="160" r="5"/><circle cx="70" cy="194" r="4"/>
  </g>

  <!-- Mähne (rosa) mit Glitzersträhne und Schleife -->
  <path class="line" fill="#ff8cc6"
        d="M116,40 Q150,44 153,80 Q166,105 157,130 Q173,150 163,175 Q171,190 167,200 L140,200 Q146,170 138,150 Q146,120 136,95 Q140,68 116,40 Z"/>
  <path d="M132,52 Q152,70 147,98 M146,112 Q158,132 150,158 M152,170 Q160,184 156,198" fill="none" stroke="#e86aa8" stroke-width="2" stroke-linecap="round"/>
  <path d="M126,46 Q157,70 151,100 Q165,130 155,160 Q163,180 159,198" fill="none" stroke="url(#glitter)" stroke-width="5" stroke-linecap="round"/>

  <!-- Ohren -->
  <path class="line" d="M70,52 L62,12 Q82,24 87,44 Z" fill="#f1f3f6"/>
  <path class="line" d="M130,52 L138,12 Q118,24 113,44 Z" fill="#f1f3f6"/>
  <path d="M70,44 L66,22 Q78,30 81,42 Z M130,44 L134,22 Q122,30 119,42 Z" fill="#ffb3d1"/>

  <!-- Kopf -->
  <ellipse class="line" cx="100" cy="82" rx="44" ry="48" fill="#f1f3f6"/>
  <g fill="#c3cad6">
    <circle cx="70" cy="62" r="6"/><circle cx="130" cy="66" r="5"/><circle cx="62" cy="98" r="4"/>
    <circle cx="139" cy="98" r="4"/><circle cx="112" cy="58" r="3"/>
  </g>
  <ellipse class="line" cx="100" cy="135" rx="36" ry="27" fill="#cfd4dc"/>

  <!-- Bäckchen -->
  <ellipse cx="66" cy="107" rx="8" ry="5" fill="#ff9ec4" opacity="0.55"/>
  <ellipse cx="134" cy="107" rx="8" ry="5" fill="#ff9ec4" opacity="0.55"/>

  <!-- Augen -->
  <g>
    <ellipse class="line" cx="82" cy="84" rx="11" ry="13" fill="#ffffff"/>
    <circle cx="83" cy="88" r="8" fill="#4a2d5c"/><circle cx="83" cy="88" r="4" fill="#1d1226"/>
    <circle cx="86" cy="84" r="3" fill="#ffffff"/><circle cx="80" cy="92" r="1.5" fill="#ffffff"/>
    <path class="line" d="M72,77 L66,72 M75,73 L71,66 M79,71 L77,64" fill="none"/>
  </g>
  <g>
    <ellipse class="line" cx="118" cy="84" rx="11" ry="13" fill="#ffffff"/>
    <circle cx="117" cy="88" r="8" fill="#4a2d5c"/><circle cx="117" cy="88" r="4" fill="#1d1226"/>
    <circle cx="120" cy="84" r="3" fill="#ffffff"/><circle cx="114" cy="92" r="1.5" fill="#ffffff"/>
    <path class="line" d="M128,77 L134,72 M125,73 L129,66 M121,71 L123,64" fill="none"/>
  </g>

  <!-- Nüstern und Mund -->
  <ellipse cx="88" cy="141" rx="3.5" ry="5" fill="#7a7f8c" transform="rotate(-15 88 141)"/>
  <ellipse cx="112" cy="141" rx="3.5" ry="5" fill="#7a7f8c" transform="rotate(15 112 141)"/>
  <path class="line" d="M90,152 Q100,159 110,152" fill="none"/>

  <!-- Halfter mit Glitzersteinen -->
  <g fill="none" stroke="#9b5de5" stroke-width="6" stroke-linecap="round">
    <path d="M65,122 Q100,132 135,122"/>
    <path d="M60,90 L66,122"/><path d="M140,90 L134,122"/>
    <path d="M60,90 Q58,62 72,50"/><path d="M140,90 Q142,62 128,50"/>
  </g>
  <g fill="#e2e6ee" stroke="#8a90a0" stroke-width="1">
    <circle cx="61" cy="92" r="3.5"/><circle cx="139" cy="92" r="3.5"/>
    <circle cx="66" cy="122" r="3.5"/><circle cx="134" cy="122" r="3.5"/>
  </g>
  <g fill="#eafcff" stroke="#7fd3e3" stroke-width="0.8">
    <circle cx="76" cy="124.6" r="2.6"/><circle cx="88" cy="126.4" r="2.6"/><circle cx="100" cy="127" r="2.6"/>
    <circle cx="112" cy="126.4" r="2.6"/><circle cx="124" cy="124.6" r="2.6"/>
    <circle cx="60" cy="76" r="2.2"/><circle cx="140" cy="76" r="2.2"/>
    <circle cx="62" cy="106" r="2.2"/><circle cx="138" cy="106" r="2.2"/>
  </g>
  <g fill="#ffffff">
    <circle cx="75" cy="123.8" r="0.9"/><circle cx="87" cy="125.6" r="0.9"/><circle cx="99" cy="126.2" r="0.9"/>
    <circle cx="111" cy="125.6" r="0.9"/><circle cx="123" cy="123.8" r="0.9"/>
  </g>

  <!-- Stirnschopf (rosa) mit Glitzersträhne -->
  <path class="line" fill="#ff8cc6"
        d="M83,40 Q92,28 100,31 Q110,28 117,40 Q119,56 110,64 Q104,53 100,66 Q95,53 89,62 Q81,52 83,40 Z"/>
  <path d="M101,34 Q104,48 100,62" fill="none" stroke="url(#glitter)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Rote Schleifen -->
  <g class="line" fill="#e5394b">
    <path d="M100,30 L85,21 Q80,30 85,39 Z"/><path d="M100,30 L115,21 Q120,30 115,39 Z"/>
    <circle cx="100" cy="30" r="4.5"/>
  </g>
  <g class="line" fill="#e5394b">
    <path d="M157,128 L146,119 Q141,127 145,136 Z"/><path d="M157,128 L168,121 Q173,129 168,137 Z"/>
    <circle cx="157" cy="128" r="4"/>
  </g>

  <!-- Glitzer -->
  <path class="sparkle" d="M152,62 Q152,70 158,70 Q152,70 152,78 Q152,70 146,70 Q152,70 152,62 Z"/>
  <path class="sparkle s2" d="M164,150 Q164,156 169,156 Q164,156 164,161 Q164,156 159,156 Q164,156 164,150 Z"/>
  <path class="sparkle s3" d="M107,40 Q107,44 111,44 Q107,44 107,48 Q107,44 103,44 Q107,44 107,40 Z"/>
  <path class="sparkle s4" d="M47,128 Q47,133 52,133 Q47,133 47,138 Q47,133 42,133 Q47,133 47,128 Z"/>
</svg>
